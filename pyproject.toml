[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qi_sort"
version = "0.3.21"
description = "Quantum-Inspired Adaptive Radix Sorting Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "Jason Pandia" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3"
]
keywords = ["sorting", "radix-sort", "c++17", "high-performance", "adaptive-sort"]

[project.urls]
Homepage = "https://github.com/PandiaJason/qi-sort"
Repository = "https://github.com/PandiaJason/qi-sort.git"
