<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Glowing Filters -->
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D2F831" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#E8F8B6" flood-opacity="0.4"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .box { fill: #09090B; stroke: #27272A; stroke-width: 1.5; rx: 8px; }
      .box-highlight { fill: #0D1204; stroke: #D2F831; stroke-width: 1.5; rx: 8px; }
      .box-l1 { fill: #111808; stroke: #D2F831; stroke-width: 2.0; rx: 10px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.3px; }
      .subtitle { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #D2F831; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #A1A1AA; line-height: 1.4; }
      .code-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; fill: #E8F8B6; font-weight: 600; }
      .highlight-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #D2F831; }
      
      .pipe-line { stroke: #3F3F46; stroke-width: 1.8; stroke-dasharray: 4,4; }
      .active-line { stroke: #D2F831; stroke-width: 2.2; }
      .pulse-dot { fill: #D2F831; }
    </style>
  </defs>

  <!-- 100% Full Black Background -->
  <rect width="900" height="520" class="bg"/>

  <!-- Logo Pill -->
  <g transform="translate(35, 24)">
    <circle cx="12" cy="12" r="11" fill="#E8F8B6" opacity="0.4"/>
    <circle cx="12" cy="12" r="7" fill="#D2F831" filter="url(#glowLime)"/>
  </g>

  <!-- Header -->
  <text x="65" y="36" class="title">qi::apex Microarchitectural Engine</text>
  <text x="65" y="52" class="subtitle">Hardware-Aware 20 KB L1-Bound Execution Pipeline · 3-Pass 32-bit</text>

  <!-- Top Level Status Badges -->
  <g transform="translate(620, 24)">
    <rect width="115" height="26" rx="13" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="57" y="17" font-family="'SF Mono', monospace" font-size="10.5" fill="#E4E4E7" text-anchor="middle">PF = 48 Prefetch</text>
  </g>
  <g transform="translate(745, 24)">
    <rect width="120" height="26" rx="13" fill="#18181B" stroke="#D2F831" stroke-width="1.2"/>
    <text x="60" y="17" font-family="'SF Mono', monospace" font-size="10.5" fill="#D2F831" text-anchor="middle">8-Way ILP Unroll</text>
  </g>

  <!-- ==================== STAGE 1: RAM & PREFETCH STREAM ==================== -->
  <g transform="translate(35, 80)">
    <rect width="180" height="400" class="box"/>
    <text x="18" y="32" class="section-label">1. Memory Streaming</text>
    <text x="18" y="52" class="desc-text">Linear DRAM / LLC Read</text>

    <!-- DRAM Block -->
    <rect x="18" y="75" width="144" height="65" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="28" y="98" class="code-badge">DRAM / L3 Cache</text>
    <text x="28" y="120" class="desc-text">10M Keys (40 MB RAM)</text>

    <!-- Arrow down -->
    <path d="M 90 145 L 90 180" stroke="#D2F831" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hardware Lookahead Prefetch Queue -->
    <rect x="18" y="185" width="144" height="110" rx="6" fill="#0D1204" stroke="#D2F831" stroke-width="1.2"/>
    <text x="28" y="210" class="highlight-text">PF=48 Prefetch Stream</text>
    <text x="28" y="232" class="desc-text">__builtin_prefetch</text>
    <text x="28" y="250" class="desc-text">(&amp;data[i + 48], 0, 0)</text>
    <text x="28" y="275" class="code-badge">Zero Cache Stall</text>

    <!-- Arrow down -->
    <path d="M 90 300 L 90 335" stroke="#D2F831" stroke-width="2"/>

    <!-- Ping Pong Buffers -->
    <rect x="18" y="340" width="144" height="115" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="28" y="365" class="section-label" font-size="12">Ping-Pong Buffers</text>
    <text x="28" y="388" class="desc-text">Buffer A: Input</text>
    <text x="28" y="408" class="desc-text">Buffer B: Scratch</text>
    <text x="28" y="432" class="code-badge">Zero Extra Allocs</text>
  </g>

  <!-- ==================== STAGE 2: 8-WAY ILP CPU CORE ==================== -->
  <g transform="translate(240, 80)">
    <rect width="250" height="400" class="box-highlight"/>
    <text x="20" y="32" class="section-label">2. 8-Way ILP CPU Core</text>
    <text x="20" y="52" class="highlight-text">Independent Register Pipelines</text>

    <!-- 8 Registers Grid -->
    <g transform="translate(18, 75)">
      <!-- Reg 0 -->
      <rect x="0" y="0" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="10" y="24" class="code-badge">c0: k[i+0]</text>
      <!-- Reg 1 -->
      <rect x="114" y="0" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="124" y="24" class="code-badge">c1: k[i+1]</text>

      <!-- Reg 2 -->
      <rect x="0" y="46" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="10" y="70" class="code-badge">c2: k[i+2]</text>
      <!-- Reg 3 -->
      <rect x="114" y="46" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="124" y="70" class="code-badge">c3: k[i+3]</text>

      <!-- Reg 4 -->
      <rect x="0" y="92" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="10" y="116" class="code-badge">c4: k[i+4]</text>
      <!-- Reg 5 -->
      <rect x="114" y="92" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="124" y="116" class="code-badge">c5: k[i+5]</text>

      <!-- Reg 6 -->
      <rect x="0" y="138" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="10" y="162" class="code-badge">c6: k[i+6]</text>
      <!-- Reg 7 -->
      <rect x="114" y="138" width="100" height="38" rx="4" fill="#18181B" stroke="#3F3F46"/>
      <text x="124" y="162" class="code-badge">c7: k[i+7]</text>
    </g>

    <!-- ALU Dispatch Explanation -->
    <rect x="18" y="275" width="214" height="180" rx="6" fill="#141417" stroke="#27272A"/>
    <text x="28" y="302" class="section-label" font-size="12">Superscalar Execution</text>
    <text x="28" y="325" class="desc-text">• 8 loads dispatched per cycle</text>
    <text x="28" y="347" class="desc-text">• Breaks dependency chain hazards</text>
    <text x="28" y="369" class="desc-text">• Fully unrolled inner counting loop</text>
    <text x="28" y="391" class="desc-text">• Sustained 314+ MKeys/s (1T)</text>
    <text x="28" y="415" class="highlight-text">• Peak 1,124 MKeys/s (Parallel)</text>
  </g>

  <!-- ==================== STAGE 3: STRICT 20 KB L1-BOUND RADIX ==================== -->
  <g transform="translate(515, 80)">
    <rect width="350" height="400" class="box-l1" filter="url(#softGlow)"/>
    <text x="24" y="32" class="section-label">3. Strict 20 KB L1-D Resident Radix</text>
    <text x="24" y="52" class="highlight-text">Zero L2 / L3 Evictions · 100% Cache Hit</text>

    <!-- 3-Pass Breakdown -->
    <g transform="translate(24, 75)">
      <!-- Pass 0 -->
      <rect x="0" y="0" width="302" height="60" rx="6" fill="#0D1204" stroke="#D2F831" stroke-width="1.2"/>
      <text x="16" y="24" class="code-badge">Pass 0 (Bits 0–10)</text>
      <text x="210" y="24" class="highlight-text">Radix-11 (16 KB)</text>
      <text x="16" y="46" class="desc-text">2,048 Histograms · Fits entirely in L1-D</text>

      <!-- Pass 1 -->
      <rect x="0" y="70" width="302" height="60" rx="6" fill="#0D1204" stroke="#D2F831" stroke-width="1.2"/>
      <text x="16" y="94" class="code-badge">Pass 1 (Bits 11–21)</text>
      <text x="210" y="94" class="highlight-text">Radix-11 (16 KB)</text>
      <text x="16" y="116" class="desc-text">2,048 Histograms · Fits entirely in L1-D</text>

      <!-- Pass 2 -->
      <rect x="0" y="140" width="302" height="60" rx="6" fill="#0D1204" stroke="#D2F831" stroke-width="1.2"/>
      <text x="16" y="164" class="code-badge">Pass 2 (Bits 22–31)</text>
      <text x="218" y="164" class="highlight-text">Radix-10 (8 KB)</text>
      <text x="16" y="186" class="desc-text">1,024 Histograms · Final In-Place Scatter</text>
    </g>

    <!-- Cache Guarantee Box -->
    <rect x="24" y="295" width="302" height="160" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="36" y="322" class="section-label" font-size="12">Microarchitecture Bounds</text>
    <text x="36" y="348" class="desc-text">L1-Data Cache Size (Modern CPU): 32 KB – 128 KB</text>
    <text x="36" y="372" class="highlight-text">qi::apex Max Footprint: 20 KB (Strict Bound)</text>
    <text x="36" y="396" class="desc-text">Comparison vs Radix-16: Radix-16 uses 512 KB</text>
    <text x="36" y="418" class="desc-text">(Radix-16 overflows L1 $\to$ thrashing L2/L3 cache)</text>
    <text x="36" y="440" class="code-badge">Result: 5.5× Speedup over std::sort</text>
  </g>

  <!-- Connecting Arrows / Dataflow Lines -->
  <!-- Stream 1 to 2 -->
  <path d="M 215 280 L 240 280" stroke="#D2F831" stroke-width="2"/>
  <polygon points="240,280 232,275 232,285" fill="#D2F831"/>

  <!-- Stream 2 to 3 -->
  <path d="M 490 280 L 515 280" stroke="#D2F831" stroke-width="2"/>
  <polygon points="515,280 507,275 507,285" fill="#D2F831"/>

</svg>
