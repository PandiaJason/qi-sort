<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <!-- Glowing Effect for Apex -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D2F831" flood-opacity="0.5"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .col-box { fill: #09090B; stroke: #262626; stroke-width: 1.2; rx: 10px; }
      .col-active { fill: #0D1204; stroke: #D2F831; stroke-width: 1.6; rx: 10px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.2px; }
      .subtitle { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11.5px; fill: #D2F831; }
      
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .col-sub { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      
      .badge-std { fill: #18181B; stroke: #333333; stroke-width: 1; rx: 4px; }
      .badge-ilp { fill: #18181B; stroke: #E8F8B6; stroke-width: 1; rx: 4px; }
      .badge-apex { fill: #111808; stroke: #D2F831; stroke-width: 1.2; rx: 6px; }
      
      .mono-text { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #CCCCCC; }
      
      .arrow-line { stroke: #D2F831; stroke-width: 1.8; fill: none; }
      .arrow-head { fill: #D2F831; }
    </style>
  </defs>

  <!-- 100% Pure Black Background -->
  <rect width="920" height="480" class="bg"/>

  <!-- Logo Pill Accent -->
  <g transform="translate(35, 22)">
    <circle cx="11" cy="11" r="10" fill="#E8F8B6" opacity="0.4"/>
    <circle cx="11" cy="11" r="6.5" fill="#D2F831" filter="url(#neonGlow)"/>
  </g>

  <!-- Title Header -->
  <text x="68" y="34" class="title">qi::apex Microarchitecture</text>
  <text x="68" y="52" class="subtitle">Hardware-Aware 20 KB L1-Bound Radix Pipeline · 3-Pass 32-bit</text>

  <!-- Top Badges -->
  <g transform="translate(640, 24)">
    <rect width="115" height="24" rx="12" fill="#18181B" stroke="#333333"/>
    <text x="57" y="16" class="mono-text" font-size="10" fill="#F2F2F2" text-anchor="middle">PF = 48 Stream</text>
  </g>
  <g transform="translate(765, 24)">
    <rect width="120" height="24" rx="12" fill="#18181B" stroke="#D2F831" stroke-width="1.2"/>
    <text x="60" y="16" class="mono-text" font-size="10" fill="#D2F831" text-anchor="middle">8-Way ILP Core</text>
  </g>

  <!-- ==================== COLUMN 1: MEMORY STREAMING ==================== -->
  <g transform="translate(35, 75)">
    <rect width="240" height="375" class="col-box"/>
    <rect x="16" y="14" width="24" height="6" rx="3" fill="#F2F2F2"/>
    <text x="16" y="38" class="col-title">1. Memory Streaming</text>
    <text x="16" y="54" class="col-sub" fill="#F2F2F2">DRAM / LLC Linear Ingest</text>

    <!-- Sub-block 1: Input DRAM -->
    <rect x="16" y="75" width="208" height="60" class="badge-std"/>
    <text x="28" y="98" class="mono-text" fill="#F2F2F2" font-weight="600">DRAM Input Vector</text>
    <text x="28" y="118" class="body-text">Linear continuous read</text>

    <!-- Arrow Down -->
    <path d="M 120 135 L 120 162" class="arrow-line"/>
    <polygon points="120,166 116,158 124,158" class="arrow-head"/>

    <!-- Sub-block 2: Prefetcher -->
    <rect x="16" y="170" width="208" height="75" rx="6" fill="#18181B" stroke="#E8F8B6" stroke-width="1"/>
    <text x="28" y="194" class="mono-text" fill="#E8F8B6" font-weight="600">PF = 48 Prefetch Stream</text>
    <text x="28" y="214" class="mono-text" font-size="10" fill="#888888">__builtin_prefetch(&amp;k[i+48])</text>
    <text x="28" y="232" class="body-text" fill="#E8F8B6">Zero DRAM latency stall</text>

    <!-- Arrow Down -->
    <path d="M 120 245 L 120 272" class="arrow-line"/>
    <polygon points="120,276 116,268 124,268" class="arrow-head"/>

    <!-- Sub-block 3: Double Buffering -->
    <rect x="16" y="280" width="208" height="70" class="badge-std"/>
    <text x="28" y="304" class="mono-text" fill="#F2F2F2" font-weight="600">Double Buffer Ping-Pong</text>
    <text x="28" y="324" class="body-text">Buffer A $\leftrightarrow$ Buffer B</text>
    <text x="28" y="340" class="mono-text" font-size="10" fill="#888888">0 extra heap allocations</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <g transform="translate(285, 255)">
    <path d="M 0 0 L 22 0" class="arrow-line"/>
    <polygon points="26,0 20,-4 20,4" class="arrow-head"/>
  </g>

  <!-- ==================== COLUMN 2: 8-WAY ILP CPU CORE ==================== -->
  <g transform="translate(320, 75)">
    <rect width="255" height="375" class="col-box"/>
    <rect x="16" y="14" width="24" height="6" rx="3" fill="#E8F8B6"/>
    <text x="16" y="38" class="col-title">2. 8-Way ILP CPU Core</text>
    <text x="16" y="54" class="col-sub" fill="#E8F8B6">Independent Register Pipes</text>

    <!-- Registers Matrix (2x4) -->
    <g transform="translate(16, 75)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="106" height="32" class="badge-ilp"/>
      <text x="12" y="21" class="mono-text" fill="#E8F8B6" font-weight="600">c0: k[i+0]</text>
      <rect x="116" y="0" width="106" height="32" class="badge-ilp"/>
      <text x="128" y="21" class="mono-text" fill="#E8F8B6" font-weight="600">c1: k[i+1]</text>

      <!-- Row 1 -->
      <rect x="0" y="38" width="106" height="32" class="badge-ilp"/>
      <text x="12" y="59" class="mono-text" fill="#E8F8B6" font-weight="600">c2: k[i+2]</text>
      <rect x="116" y="38" width="106" height="32" class="badge-ilp"/>
      <text x="128" y="59" class="mono-text" fill="#E8F8B6" font-weight="600">c3: k[i+3]</text>

      <!-- Row 2 -->
      <rect x="0" y="76" width="106" height="32" class="badge-ilp"/>
      <text x="12" y="97" class="mono-text" fill="#E8F8B6" font-weight="600">c4: k[i+4]</text>
      <rect x="116" y="76" width="106" height="32" class="badge-ilp"/>
      <text x="128" y="97" class="mono-text" fill="#E8F8B6" font-weight="600">c5: k[i+5]</text>

      <!-- Row 3 -->
      <rect x="0" y="114" width="106" height="32" class="badge-ilp"/>
      <text x="12" y="135" class="mono-text" fill="#E8F8B6" font-weight="600">c6: k[i+6]</text>
      <rect x="116" y="114" width="106" height="32" class="badge-ilp"/>
      <text x="128" y="135" class="mono-text" fill="#E8F8B6" font-weight="600">c7: k[i+7]</text>
    </g>

    <!-- Core Features -->
    <rect x="16" y="240" width="222" height="110" class="badge-std"/>
    <text x="28" y="266" class="mono-text" fill="#F2F2F2" font-weight="600">Superscalar ALU Saturation</text>
    <text x="28" y="288" class="body-text">• 8 parallel loads / cycle</text>
    <text x="28" y="308" class="body-text">• Zero RAW dependency hazards</text>
    <text x="28" y="328" class="body-text">• Unrolled inner counting loop</text>
    <text x="28" y="348" class="mono-text" font-size="10.5" fill="#D2F831">314+ MKeys/s sustained (1T)</text>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <g transform="translate(585, 255)">
    <path d="M 0 0 L 22 0" class="arrow-line"/>
    <polygon points="26,0 20,-4 20,4" class="arrow-head"/>
  </g>

  <!-- ==================== COLUMN 3: STRICT 20 KB L1-BOUND RADIX ==================== -->
  <g transform="translate(618, 75)">
    <rect width="268" height="375" class="col-active" filter="url(#neonGlow)"/>
    <rect x="16" y="14" width="24" height="6" rx="3" fill="#D2F831"/>
    <text x="16" y="38" class="col-title">3. Strict 20 KB L1-Bound</text>
    <text x="16" y="54" class="col-sub" fill="#D2F831">100% L1-Data Resident</text>

    <!-- Pass 0 -->
    <rect x="16" y="75" width="236" height="52" class="badge-apex"/>
    <text x="28" y="96" class="mono-text" fill="#D2F831" font-weight="600">Pass 0 (Bits 0–10)</text>
    <text x="28" y="114" class="body-text">Radix-11 (16 KB) · 2,048 bins</text>

    <!-- Pass 1 -->
    <rect x="16" y="135" width="236" height="52" class="badge-apex"/>
    <text x="28" y="156" class="mono-text" fill="#D2F831" font-weight="600">Pass 1 (Bits 11–21)</text>
    <text x="28" y="174" class="body-text">Radix-11 (16 KB) · 2,048 bins</text>

    <!-- Pass 2 -->
    <rect x="16" y="195" width="236" height="52" class="badge-apex"/>
    <text x="28" y="216" class="mono-text" fill="#D2F831" font-weight="600">Pass 2 (Bits 22–31)</text>
    <text x="28" y="234" class="body-text">Radix-10 (8 KB) · 1,024 bins</text>

    <!-- Cache Guarantee Box -->
    <rect x="16" y="260" width="236" height="90" rx="6" fill="#18181B" stroke="#333333"/>
    <text x="26" y="284" class="mono-text" fill="#FFFFFF" font-weight="600">Hardware Guarantee</text>
    <text x="26" y="304" class="body-text">• Max Footprint: <tspan fill="#D2F831" font-weight="600">20 KB &lt; 32 KB L1</tspan></text>
    <text x="26" y="322" class="body-text">• Zero L2/L3 cache evictions</text>
    <text x="26" y="340" class="mono-text" font-size="10.5" fill="#D2F831">5.5× speedup vs std::sort</text>
  </g>

</svg>
