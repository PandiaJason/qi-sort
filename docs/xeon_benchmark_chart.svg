<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D2F831" flood-opacity="0.4"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .chart-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: -0.2px; }
      .subtitle { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; fill: #D2F831; text-anchor: middle; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #FFFFFF; font-weight: 600; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; font-weight: 600; text-anchor: end; }
      .x-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; font-weight: 500; }
      .tick { stroke: #FFFFFF; stroke-width: 1.5; }
      .grid { stroke: #262626; stroke-dasharray: 2,2; stroke-width: 1; }
      .legend-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #FFFFFF; font-weight: 600; }
      
      .bar-apex { fill: #D2F831; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-qisort { fill: #E8F8B6; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-pdq { fill: #F2F2F2; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-ska { fill: #CCCCCC; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-std { fill: #888888; stroke: #FFFFFF; stroke-width: 0.6; }
    </style>
  </defs>

  <rect width="760" height="570" class="bg"/>

  <g transform="translate(35, 22)">
    <circle cx="12" cy="12" r="11" fill="#E8F8B6" opacity="0.5"/>
    <circle cx="12" cy="12" r="7" fill="#D2F831" filter="url(#neonGlow)"/>
  </g>

  <!-- Title & Subtitle in Same Exact Layout -->
  <text x="450" y="32" class="title">Sorting 10⁷ elements</text>
  <text x="450" y="50" class="subtitle">Intel Xeon Platinum 8481C @ 2.7GHz · Single-Threaded (1T) · Lower is better</text>

  <rect x="215" y="65" width="505" height="425" class="chart-box"/>
  <line x1="215.0" y1="65" x2="215.0" y2="490" class="grid"/>
  <line x1="215.0" y1="490" x2="215.0" y2="497" class="tick"/>
  <text x="215.0" y="513" class="x-label">0</text>
  <line x1="316.0" y1="65" x2="316.0" y2="490" class="grid"/>
  <line x1="316.0" y1="490" x2="316.0" y2="497" class="tick"/>
  <text x="316.0" y="513" class="x-label">200</text>
  <line x1="417.0" y1="65" x2="417.0" y2="490" class="grid"/>
  <line x1="417.0" y1="490" x2="417.0" y2="497" class="tick"/>
  <text x="417.0" y="513" class="x-label">400</text>
  <line x1="518.0" y1="65" x2="518.0" y2="490" class="grid"/>
  <line x1="518.0" y1="490" x2="518.0" y2="497" class="tick"/>
  <text x="518.0" y="513" class="x-label">600</text>
  <line x1="619.0" y1="65" x2="619.0" y2="490" class="grid"/>
  <line x1="619.0" y1="490" x2="619.0" y2="497" class="tick"/>
  <text x="619.0" y="513" class="x-label">800</text>
  <line x1="720.0" y1="65" x2="720.0" y2="490" class="grid"/>
  <line x1="720.0" y1="490" x2="720.0" y2="497" class="tick"/>
  <text x="720.0" y="513" class="x-label">1000</text>

  <text x="467.5" y="536" class="axis-title">Execution Time in Milliseconds (Lower is better)</text>
  <text x="205" y="95.6" class="y-label">Uniform Random 32-bit</text>
  <rect x="215" y="75.1" width="37.4" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="82.6" width="37.2" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="90.1" width="156.1" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="97.6" width="140.0" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="105.1" width="447.4" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="148.7" class="y-label">Byte Duplicates (0–255)</text>
  <rect x="215" y="128.2" width="4.6" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="135.7" width="4.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="143.2" width="40.0" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="150.7" width="49.9" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="158.2" width="193.9" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="201.8" class="y-label">Periodic Sawtooth (1K)</text>
  <rect x="215" y="181.3" width="3.7" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="188.8" width="3.7" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="196.3" width="55.2" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="203.8" width="55.2" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="211.3" width="140.7" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="254.9" class="y-label">16-bit Range (0–65K)</text>
  <rect x="215" y="234.4" width="24.8" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="241.9" width="28.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="249.4" width="74.3" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="256.9" width="47.8" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="264.4" width="347.9" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="308.1" class="y-label">Already Sorted Monotonic</text>
  <rect x="215" y="287.6" width="3.0" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="295.1" width="3.0" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="302.6" width="5.1" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="310.1" width="64.8" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="317.6" width="98.3" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="361.2" class="y-label">Reverse Sorted Monotonic</text>
  <rect x="215" y="340.7" width="4.1" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="348.2" width="5.7" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="355.7" width="8.5" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="363.2" width="68.8" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="370.7" width="61.3" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="414.3" class="y-label">Nearly Sorted (~98%)</text>
  <rect x="215" y="393.8" width="89.1" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="401.3" width="118.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="408.8" width="66.9" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="416.3" width="102.6" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="423.8" width="117.6" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="467.4" class="y-label">Pipe Organ (Mirrored Ramp)</text>
  <rect x="215" y="446.9" width="94.7" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="454.4" width="94.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="461.9" width="166.5" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="469.4" width="82.6" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="476.9" width="505.0" height="6.5" rx="1" class="bar-std"/>

  <g transform="translate(555, 195)">
    <rect width="155" height="120" rx="4" class="legend-box"/>
    
    <rect x="10" y="10" width="20" height="9" rx="1" class="bar-apex"/>
    <text x="38" y="18" class="legend-text">qi::apex</text>

    <rect x="10" y="32" width="20" height="9" rx="1" class="bar-qisort"/>
    <text x="38" y="40" class="legend-text">qi::sort</text>

    <rect x="10" y="54" width="20" height="9" rx="1" class="bar-pdq"/>
    <text x="38" y="62" class="legend-text">pdqsort</text>

    <rect x="10" y="76" width="20" height="9" rx="1" class="bar-ska"/>
    <text x="38" y="84" class="legend-text">ska_sort</text>

    <rect x="10" y="98" width="20" height="9" rx="1" class="bar-std"/>
    <text x="38" y="106" class="legend-text">std::sort</text>
  </g>
</svg>