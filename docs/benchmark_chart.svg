<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#141922"/>
    </linearGradient>

    <!-- Color 1: Primary Vibrant Lime (#D5F53D) -->
    <linearGradient id="limePrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5F53D"/>
      <stop offset="100%" stop-color="#E2FB5E"/>
    </linearGradient>

    <!-- Color 2: Soft Pale Lime Glow (#E8F8B6 / #F4FBD2) -->
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5DF32"/>
      <stop offset="100%" stop-color="#D5F53D"/>
    </linearGradient>

    <!-- Color 3: Warm Ivory Neutral (#FAF9F6 / Light Surface) -->
    <linearGradient id="ivoryNeutral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E1DC"/>
      <stop offset="100%" stop-color="#FAF9F6"/>
    </linearGradient>

    <!-- Competitor Neutral Grey -->
    <linearGradient id="slateMuted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#3D444D"/>
    </linearGradient>

    <filter id="limeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D5F53D" flood-opacity="0.35"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FAF9F6; letter-spacing: -0.3px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8B949E; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #C9D1D9; }
      .bar-val { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #FAF9F6; }
      .bar-val-lime { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; font-weight: 800; fill: #D5F53D; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FAF9F6; font-weight: 600; }
      .grid { stroke: #21262D; stroke-dasharray: 3,3; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas Container -->
  <rect width="950" height="560" rx="16" fill="url(#canvasGrad)" stroke="#30363D" stroke-width="1.2"/>

  <!-- Color Accent Tag -->
  <g transform="translate(35, 30)">
    <circle cx="10" cy="10" r="10" fill="#F4FBD2" opacity="0.4"/>
    <circle cx="10" cy="10" r="6" fill="#D5F53D"/>
  </g>

  <!-- Header -->
  <text x="65" y="42" class="title">qi::apex Benchmark Execution — 10,000,000 Keys</text>
  <text x="65" y="63" class="subtitle">Lower is Better · Apple Silicon M1 Pro · clang++ -O3 -std=c++17</text>

  <!-- Legend -->
  <g transform="translate(470, 32)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="20" y="11" class="legend-text">qi::apex (1T)</text>

    <rect x="130" y="0" width="14" height="14" rx="4" fill="url(#limeGlow)"/>
    <text x="150" y="11" class="legend-text">qi::apex (Parallel)</text>
    
    <rect x="280" y="0" width="14" height="14" rx="4" fill="url(#ivoryNeutral)"/>
    <text x="300" y="11" class="legend-text">pdqsort (1T)</text>
    
    <rect x="395" y="0" width="14" height="14" rx="4" fill="url(#slateMuted)"/>
    <text x="415" y="11" class="legend-text">std::sort</text>
  </g>

  <!-- Grid Lines -->
  <line x1="220" y1="95" x2="900" y2="95" stroke="#30363D" stroke-width="1"/>
  <line x1="220" y1="500" x2="900" y2="500" stroke="#30363D" stroke-width="1"/>
  <line x1="390" y1="95" x2="390" y2="500" class="grid"/>
  <line x1="560" y1="95" x2="560" y2="500" class="grid"/>
  <line x1="730" y1="95" x2="730" y2="500" class="grid"/>
  <line x1="900" y1="95" x2="900" y2="500" class="grid"/>

  <!-- X Axis Labels (Time in ms) -->
  <text x="220" y="522" class="subtitle" text-anchor="middle">0 ms</text>
  <text x="390" y="522" class="subtitle" text-anchor="middle">60 ms</text>
  <text x="560" y="522" class="subtitle" text-anchor="middle">120 ms</text>
  <text x="730" y="522" class="subtitle" text-anchor="middle">180 ms</text>
  <text x="900" y="522" class="subtitle" text-anchor="middle">240 ms</text>

  <!-- ROW 1: Uniform Random 32-bit -->
  <g transform="translate(0, 105)">
    <text x="205" y="32" class="axis-label" text-anchor="end">Uniform Random 32-bit</text>
    <rect x="220" y="4"  width="104" height="11" rx="3" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="332" y="13" class="bar-val-lime">36.6 ms (6.3x)</text>

    <rect x="220" y="18" width="50"  height="11" rx="3" fill="url(#limeGlow)"/>
    <text x="278" y="27" class="bar-val">17.6 ms (Par)</text>
    
    <rect x="220" y="32" width="625" height="11" rx="3" fill="url(#ivoryNeutral)"/>
    <text x="852" y="41" class="bar-val">220.9 ms</text>
    
    <rect x="220" y="46" width="651" height="11" rx="3" fill="url(#slateMuted)"/>
    <text x="878" y="55" class="bar-val">230.1 ms</text>
  </g>

  <!-- ROW 2: Byte Duplicates (0-255) -->
  <g transform="translate(0, 185)">
    <text x="205" y="32" class="axis-label" text-anchor="end">Byte Dups (0–255)</text>
    <rect x="220" y="4"  width="12"  height="11" rx="3" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="240" y="13" class="bar-val-lime">4.1 ms (19.7x)</text>

    <rect x="220" y="18" width="21"  height="11" rx="3" fill="url(#limeGlow)"/>
    <text x="249" y="27" class="bar-val">7.5 ms (Par)</text>
    
    <rect x="220" y="32" width="165" height="11" rx="3" fill="url(#ivoryNeutral)"/>
    <text x="393" y="41" class="bar-val">58.4 ms</text>
    
    <rect x="220" y="46" width="230" height="11" rx="3" fill="url(#slateMuted)"/>
    <text x="458" y="55" class="bar-val">81.3 ms</text>
  </g>

  <!-- ROW 3: Sawtooth Periodic Patterns -->
  <g transform="translate(0, 265)">
    <text x="205" y="32" class="axis-label" text-anchor="end">Periodic Sawtooth (1K)</text>
    <rect x="220" y="4"  width="12"  height="11" rx="3" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="240" y="13" class="bar-val-lime">4.0 ms (26.4x)</text>

    <rect x="220" y="18" width="19"  height="11" rx="3" fill="url(#limeGlow)"/>
    <text x="247" y="27" class="bar-val">6.8 ms (Par)</text>
    
    <rect x="220" y="32" width="239" height="11" rx="3" fill="url(#ivoryNeutral)"/>
    <text x="467" y="41" class="bar-val">84.4 ms</text>
    
    <rect x="220" y="46" width="302" height="11" rx="3" fill="url(#slateMuted)"/>
    <text x="530" y="55" class="bar-val">106.5 ms</text>
  </g>

  <!-- ROW 4: 16-bit Domain Range (0-65K) -->
  <g transform="translate(0, 345)">
    <text x="205" y="32" class="axis-label" text-anchor="end">16-bit Domain (0–65K)</text>
    <rect x="220" y="4"  width="62"  height="11" rx="3" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="290" y="13" class="bar-val-lime">21.8 ms (6.2x)</text>

    <rect x="220" y="18" width="39"  height="11" rx="3" fill="url(#limeGlow)"/>
    <text x="267" y="27" class="bar-val">13.9 ms (Par)</text>
    
    <rect x="220" y="32" width="313" height="11" rx="3" fill="url(#ivoryNeutral)"/>
    <text x="541" y="41" class="bar-val">110.5 ms</text>
    
    <rect x="220" y="46" width="383" height="11" rx="3" fill="url(#slateMuted)"/>
    <text x="611" y="55" class="bar-val">135.3 ms</text>
  </g>

  <!-- ROW 5: Pre-Sorted Monotonic -->
  <g transform="translate(0, 425)">
    <text x="205" y="32" class="axis-label" text-anchor="end">Already Sorted ($O(N)$)</text>
    <rect x="220" y="4"  width="13"  height="11" rx="3" fill="url(#limePrimary)" filter="url(#limeShadow)"/>
    <text x="241" y="13" class="bar-val-lime">4.4 ms (2.4x)</text>

    <rect x="220" y="18" width="13"  height="11" rx="3" fill="url(#limeGlow)"/>
    <text x="241" y="27" class="bar-val">4.4 ms (Par)</text>
    
    <rect x="220" y="32" width="22"  height="11" rx="3" fill="url(#ivoryNeutral)"/>
    <text x="250" y="41" class="bar-val">7.7 ms</text>
    
    <rect x="220" y="46" width="30"  height="11" rx="3" fill="url(#slateMuted)"/>
    <text x="258" y="55" class="bar-val">10.5 ms</text>
  </g>

</svg>
