<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D2F831" flood-opacity="0.4"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .chart-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: -0.2px; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #FFFFFF; font-weight: 600; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; font-weight: 600; text-anchor: end; }
      .x-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; font-weight: 500; }
      .tick { stroke: #FFFFFF; stroke-width: 1.5; }
      .grid { stroke: #262626; stroke-dasharray: 2,2; stroke-width: 1; }
      .legend-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #FFFFFF; font-weight: 600; }
      
      .bar-apex { fill: #D2F831; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-qisort { fill: #E8F8B6; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-pdq { fill: #F2F2F2; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-ska { fill: #CCCCCC; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-std { fill: #888888; stroke: #FFFFFF; stroke-width: 0.6; }
    </style>
  </defs>

  <rect width="760" height="550" class="bg"/>

  <g transform="translate(35, 20)">
    <circle cx="12" cy="12" r="11" fill="#E8F8B6" opacity="0.5"/>
    <circle cx="12" cy="12" r="7" fill="#D2F831" filter="url(#neonGlow)"/>
  </g>

  <!-- Title with Processor Name in Brackets -->
  <text x="450" y="34" class="title">Sorting 10⁷ elements (Apple Silicon M1 Pro)</text>

  <rect x="215" y="52" width="505" height="435" class="chart-box"/>
  <line x1="215.0" y1="52" x2="215.0" y2="487" class="grid"/>
  <line x1="215.0" y1="487" x2="215.0" y2="494" class="tick"/>
  <text x="215.0" y="510" class="x-label">0</text>
  <line x1="316.0" y1="52" x2="316.0" y2="487" class="grid"/>
  <line x1="316.0" y1="487" x2="316.0" y2="494" class="tick"/>
  <text x="316.0" y="510" class="x-label">40</text>
  <line x1="417.0" y1="52" x2="417.0" y2="487" class="grid"/>
  <line x1="417.0" y1="487" x2="417.0" y2="494" class="tick"/>
  <text x="417.0" y="510" class="x-label">80</text>
  <line x1="518.0" y1="52" x2="518.0" y2="487" class="grid"/>
  <line x1="518.0" y1="487" x2="518.0" y2="494" class="tick"/>
  <text x="518.0" y="510" class="x-label">120</text>
  <line x1="619.0" y1="52" x2="619.0" y2="487" class="grid"/>
  <line x1="619.0" y1="487" x2="619.0" y2="494" class="tick"/>
  <text x="619.0" y="510" class="x-label">160</text>
  <line x1="720.0" y1="52" x2="720.0" y2="487" class="grid"/>
  <line x1="720.0" y1="487" x2="720.0" y2="494" class="tick"/>
  <text x="720.0" y="510" class="x-label">200</text>

  <text x="467.5" y="533" class="axis-title">Cycles per element (Lower is better)</text>
  <text x="205" y="83.2" class="y-label">Uniform Random 32-bit</text>
  <rect x="215" y="62.7" width="33.3" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="70.2" width="31.0" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="77.7" width="178.2" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="85.2" width="145.7" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="92.7" width="184.8" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="137.6" class="y-label">Byte Duplicates (0–255)</text>
  <rect x="215" y="117.1" width="3.2" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="124.6" width="3.5" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="132.1" width="48.3" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="139.6" width="62.6" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="147.1" width="63.6" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="191.9" class="y-label">Periodic Sawtooth (1K)</text>
  <rect x="215" y="171.4" width="3.2" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="178.9" width="3.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="186.4" width="68.3" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="193.9" width="78.9" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="201.4" width="85.9" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="246.3" class="y-label">16-bit Range (0–65,535)</text>
  <rect x="215" y="225.8" width="17.7" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="233.3" width="32.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="240.8" width="90.5" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="248.3" width="56.8" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="255.8" width="110.8" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="300.7" class="y-label">Already Sorted Monotonic</text>
  <rect x="215" y="280.2" width="3.5" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="287.7" width="3.5" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="295.2" width="6.2" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="302.7" width="109.9" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="310.2" width="8.5" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="355.1" class="y-label">Reverse Sorted Monotonic</text>
  <rect x="215" y="334.6" width="5.1" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="342.1" width="5.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="349.6" width="10.5" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="357.1" width="117.1" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="364.6" width="14.3" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="409.4" class="y-label">Nearly Sorted (~98%)</text>
  <rect x="215" y="388.9" width="90.6" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="396.4" width="83.0" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="403.9" width="79.8" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="411.4" width="135.6" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="418.9" width="83.0" height="6.5" rx="1" class="bar-std"/>
  <text x="205" y="463.8" class="y-label">Pipe Organ (Mirrored Ramp)</text>
  <rect x="215" y="443.3" width="108.7" height="6.5" rx="1" class="bar-apex"/>
  <rect x="215" y="450.8" width="111.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="215" y="458.3" width="197.2" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="215" y="465.8" width="129.0" height="6.5" rx="1" class="bar-ska"/>
  <rect x="215" y="473.3" width="472.1" height="6.5" rx="1" class="bar-std"/>

  <g transform="translate(555, 185)">
    <rect width="155" height="120" rx="4" class="legend-box"/>
    
    <rect x="10" y="10" width="20" height="9" rx="1" class="bar-apex"/>
    <text x="38" y="18" class="legend-text">qi::apex</text>

    <rect x="10" y="32" width="20" height="9" rx="1" class="bar-qisort"/>
    <text x="38" y="40" class="legend-text">qi::sort</text>

    <rect x="10" y="54" width="20" height="9" rx="1" class="bar-pdq"/>
    <text x="38" y="62" class="legend-text">pdqsort</text>

    <rect x="10" y="76" width="20" height="9" rx="1" class="bar-ska"/>
    <text x="38" y="84" class="legend-text">ska_sort</text>

    <rect x="10" y="98" width="20" height="9" rx="1" class="bar-std"/>
    <text x="38" y="106" class="legend-text">std::sort</text>
  </g>
</svg>