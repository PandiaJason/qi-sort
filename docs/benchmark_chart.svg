<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .chart-box { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #000000; text-anchor: middle; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #000000; font-weight: 500; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #000000; font-weight: 500; text-anchor: end; }
      .x-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #000000; text-anchor: middle; }
      .tick { stroke: #000000; stroke-width: 1.2; }
      .grid { stroke: #E0E0E0; stroke-dasharray: 2,2; stroke-width: 0.8; }
      .legend-box { fill: #FFFFFF; stroke: #000000; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #000000; font-weight: 500; }
      .bar { stroke: #000000; stroke-width: 1.0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="540" class="bg"/>

  <!-- Title -->
  <text x="460" y="32" class="title">Sorting 10⁶ elements</text>

  <!-- Chart Bounding Box (x: 190 to 730, y: 45 to 475) -->
  <rect x="190" y="45" width="540" height="430" class="chart-box"/>

  <!-- Vertical Ticks & Grid Lines (0, 50, 100, 150, 200, 250, 300, 350) -->
  <!-- scale = 540 / 350 = 1.5428 px per cycle -->
  <line x1="190" y1="45" x2="190" y2="482" class="tick"/>
  <text x="190" y="498" class="x-label">0</text>

  <line x1="267" y1="45" x2="267" y2="475" class="grid"/>
  <line x1="267" y1="475" x2="267" y2="482" class="tick"/>
  <text x="267" y="498" class="x-label">50</text>

  <line x1="344" y1="45" x2="344" y2="475" class="grid"/>
  <line x1="344" y1="475" x2="344" y2="482" class="tick"/>
  <text x="344" y="498" class="x-label">100</text>

  <line x1="421" y1="45" x2="421" y2="475" class="grid"/>
  <line x1="421" y1="475" x2="421" y2="482" class="tick"/>
  <text x="421" y="498" class="x-label">150</text>

  <line x1="498" y1="45" x2="498" y2="475" class="grid"/>
  <line x1="498" y1="475" x2="498" y2="482" class="tick"/>
  <text x="498" y="498" class="x-label">200</text>

  <line x1="575" y1="45" x2="575" y2="475" class="grid"/>
  <line x1="575" y1="475" x2="575" y2="482" class="tick"/>
  <text x="575" y="498" class="x-label">250</text>

  <line x1="652" y1="45" x2="652" y2="475" class="grid"/>
  <line x1="652" y1="475" x2="652" y2="482" class="tick"/>
  <text x="652" y="498" class="x-label">300</text>

  <line x1="730" y1="45" x2="730" y2="482" class="tick"/>
  <text x="730" y="498" class="x-label">350</text>

  <!-- X-Axis Label -->
  <text x="460" y="524" class="axis-title">Cycles per element (Apple Silicon M1 @ 3.2GHz)</text>

  <!-- ==================== ROWS (Height per row = 53.75px) ==================== -->

  <!-- ROW 1: Shuffled (y: 52) -->
  <text x="180" y="78" class="y-label">Shuffled</text>
  <rect x="190" y="52" width="48" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="59" width="53" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="66" width="102" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="73" width="174" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="80" width="335" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 2: Shuffled (16 values) (y: 106) -->
  <text x="180" y="132" class="y-label">Shuffled (16 values)</text>
  <rect x="190" y="106" width="18" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="113" width="18" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="120" width="73" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="127" width="34" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="134" width="192" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 3: All equal (y: 160) -->
  <text x="180" y="186" class="y-label">All equal</text>
  <rect x="190" y="160" width="6" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="167" width="6" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="174" width="71" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="181" width="9" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="188" width="58" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 4: Ascending (y: 214) -->
  <text x="180" y="240" class="y-label">Ascending</text>
  <rect x="190" y="214" width="6" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="221" width="6" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="228" width="113" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="235" width="8" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="242" width="76" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 5: Descending (y: 268) -->
  <text x="180" y="294" class="y-label">Descending</text>
  <rect x="190" y="268" width="9" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="275" width="9" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="282" width="120" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="289" width="13" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="296" width="84" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 6: Pipe organ (y: 322) -->
  <text x="180" y="348" class="y-label">Pipe organ</text>
  <rect x="190" y="322" width="72" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="329" width="71" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="336" width="134" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="343" width="183" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="350" width="395" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 7: Push front (y: 376) -->
  <text x="180" y="402" class="y-label">Push front</text>
  <rect x="190" y="376" width="48" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="383" width="53" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="390" width="139" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="397" width="71" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="404" width="484" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ROW 8: Push middle (y: 430) -->
  <text x="180" y="456" class="y-label">Push middle</text>
  <rect x="190" y="430" width="48" height="7" fill="#D5F53D" class="bar"/>
  <rect x="190" y="437" width="53" height="7" fill="#BEE838" class="bar"/>
  <rect x="190" y="444" width="83" height="7" fill="#E8F8B6" class="bar"/>
  <rect x="190" y="451" width="10" height="7" fill="#1F77B4" class="bar"/>
  <rect x="190" y="458" width="274" height="7" fill="#AEC7E8" class="bar"/>

  <!-- ==================== LEGEND BOX ==================== -->
  <g transform="translate(565, 175)">
    <rect width="150" height="120" class="legend-box"/>
    
    <rect x="10" y="10" width="22" height="9" fill="#D5F53D" class="bar"/>
    <text x="38" y="18" class="legend-text">qi::apex</text>

    <rect x="10" y="32" width="22" height="9" fill="#BEE838" class="bar"/>
    <text x="38" y="40" class="legend-text">qi::sort</text>

    <rect x="10" y="54" width="22" height="9" fill="#E8F8B6" class="bar"/>
    <text x="38" y="62" class="legend-text">ska_sort</text>

    <rect x="10" y="76" width="22" height="9" fill="#1F77B4" class="bar"/>
    <text x="38" y="84" class="legend-text">pdqsort</text>

    <rect x="10" y="98" width="22" height="9" fill="#AEC7E8" class="bar"/>
    <text x="38" y="106" class="legend-text">std::sort</text>
  </g>

</svg>
