<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D2F831" flood-opacity="0.4"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .chart-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: -0.2px; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #FFFFFF; font-weight: 600; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; font-weight: 600; text-anchor: end; }
      .x-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; font-weight: 500; }
      .tick { stroke: #FFFFFF; stroke-width: 1.5; }
      .grid { stroke: #262626; stroke-dasharray: 2,2; stroke-width: 1; }
      .legend-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #FFFFFF; font-weight: 600; }
      
      /* Zero Blue Tint Pure Neutral Monochrome */
      .bar-apex { fill: #D2F831; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-qisort { fill: #E8F8B6; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-pdq { fill: #F2F2F2; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-ska { fill: #CCCCCC; stroke: #FFFFFF; stroke-width: 0.6; }
      .bar-std { fill: #888888; stroke: #FFFFFF; stroke-width: 0.6; }
    </style>
  </defs>

  <rect width="760" height="560" class="bg"/>

  <g transform="translate(35, 24)">
    <circle cx="12" cy="12" r="11" fill="#E8F8B6" opacity="0.5"/>
    <circle cx="12" cy="12" r="7" fill="#D2F831" filter="url(#neonGlow)"/>
  </g>

  <text x="450" y="36" class="title">Sorting 10⁷ elements (N = 10,000,000)</text>
  <rect x="210" y="55" width="510" height="430" class="chart-box"/>
  <line x1="210.0" y1="55" x2="210.0" y2="485" class="grid"/>
  <line x1="210.0" y1="485" x2="210.0" y2="492" class="tick"/>
  <text x="210.0" y="508" class="x-label">0</text>
  <line x1="312.0" y1="55" x2="312.0" y2="485" class="grid"/>
  <line x1="312.0" y1="485" x2="312.0" y2="492" class="tick"/>
  <text x="312.0" y="508" class="x-label">40</text>
  <line x1="414.0" y1="55" x2="414.0" y2="485" class="grid"/>
  <line x1="414.0" y1="485" x2="414.0" y2="492" class="tick"/>
  <text x="414.0" y="508" class="x-label">80</text>
  <line x1="516.0" y1="55" x2="516.0" y2="485" class="grid"/>
  <line x1="516.0" y1="485" x2="516.0" y2="492" class="tick"/>
  <text x="516.0" y="508" class="x-label">120</text>
  <line x1="618.0" y1="55" x2="618.0" y2="485" class="grid"/>
  <line x1="618.0" y1="485" x2="618.0" y2="492" class="tick"/>
  <text x="618.0" y="508" class="x-label">160</text>
  <line x1="720.0" y1="55" x2="720.0" y2="485" class="grid"/>
  <line x1="720.0" y1="485" x2="720.0" y2="492" class="tick"/>
  <text x="720.0" y="508" class="x-label">200</text>

  <text x="465.0" y="531" class="axis-title">Cycles per element (Apple Silicon M1 @ 3.2GHz)</text>
  <text x="200" y="85.9" class="y-label">Uniform Random 32-bit</text>
  <rect x="210" y="65.4" width="33.6" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="72.9" width="31.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="80.4" width="180.0" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="87.9" width="147.1" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="95.4" width="186.6" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="139.6" class="y-label">Byte Duplicates (0–255)</text>
  <rect x="210" y="119.1" width="3.3" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="126.6" width="3.5" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="134.1" width="48.7" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="141.6" width="63.2" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="149.1" width="64.2" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="193.4" class="y-label">Periodic Sawtooth (1K)</text>
  <rect x="210" y="172.9" width="3.2" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="180.4" width="3.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="187.9" width="69.0" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="195.4" width="79.7" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="202.9" width="86.7" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="247.1" class="y-label">16-bit Range (0–65,535)</text>
  <rect x="210" y="226.6" width="17.8" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="234.1" width="32.7" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="241.6" width="91.4" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="249.1" width="57.4" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="256.6" width="111.9" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="300.9" class="y-label">Already Sorted Monotonic</text>
  <rect x="210" y="280.4" width="3.5" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="287.9" width="3.5" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="295.4" width="6.3" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="302.9" width="111.0" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="310.4" width="8.6" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="354.6" class="y-label">Reverse Sorted Monotonic</text>
  <rect x="210" y="334.1" width="5.1" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="341.6" width="5.3" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="349.1" width="10.6" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="356.6" width="118.2" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="364.1" width="14.5" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="408.4" class="y-label">Nearly Sorted (~98%)</text>
  <rect x="210" y="387.9" width="91.5" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="395.4" width="83.8" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="402.9" width="80.6" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="410.4" width="136.9" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="417.9" width="83.9" height="6.5" rx="1" class="bar-std"/>
  <text x="200" y="462.1" class="y-label">Pipe Organ (Mirrored Ramp)</text>
  <rect x="210" y="441.6" width="109.8" height="6.5" rx="1" class="bar-apex"/>
  <rect x="210" y="449.1" width="112.4" height="6.5" rx="1" class="bar-qisort"/>
  <rect x="210" y="456.6" width="199.2" height="6.5" rx="1" class="bar-pdq"/>
  <rect x="210" y="464.1" width="130.3" height="6.5" rx="1" class="bar-ska"/>
  <rect x="210" y="471.6" width="476.8" height="6.5" rx="1" class="bar-std"/>

  <g transform="translate(555, 185)">
    <rect width="155" height="120" rx="4" class="legend-box"/>
    
    <rect x="10" y="10" width="20" height="9" rx="1" class="bar-apex"/>
    <text x="38" y="18" class="legend-text">qi::apex</text>

    <rect x="10" y="32" width="20" height="9" rx="1" class="bar-qisort"/>
    <text x="38" y="40" class="legend-text">qi::sort</text>

    <rect x="10" y="54" width="20" height="9" rx="1" class="bar-pdq"/>
    <text x="38" y="62" class="legend-text">pdqsort</text>

    <rect x="10" y="76" width="20" height="9" rx="1" class="bar-ska"/>
    <text x="38" y="84" class="legend-text">ska_sort</text>

    <rect x="10" y="98" width="20" height="9" rx="1" class="bar-std"/>
    <text x="38" y="106" class="legend-text">std::sort</text>
  </g>
</svg>