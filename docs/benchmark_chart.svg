<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" height="100%">
  <defs>
    <!-- Glowing Drop Shadow for Neon Lime -->
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D2F831" flood-opacity="0.4"/>
    </filter>

    <style>
      .bg { fill: #000000; }
      .chart-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: -0.2px; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #FFFFFF; font-weight: 600; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #FFFFFF; font-weight: 600; text-anchor: end; }
      .x-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; font-weight: 500; }
      .tick { stroke: #FFFFFF; stroke-width: 1.5; }
      .grid { stroke: #27272A; stroke-dasharray: 2,2; stroke-width: 1; }
      .legend-box { fill: #000000; stroke: #FFFFFF; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #FFFFFF; font-weight: 600; }
      
      /* Color Tokens */
      .bar-apex { fill: #D2F831; stroke: #FFFFFF; stroke-width: 0.6; } /* 1. Electric Lime */
      .bar-qisort { fill: #E8F8B6; stroke: #FFFFFF; stroke-width: 0.6; } /* 2. Soft Lime */
      .bar-pdq { fill: #E4E4E7; stroke: #FFFFFF; stroke-width: 0.6; } /* 3. Light Grey */
      .bar-ska { fill: #71717A; stroke: #FFFFFF; stroke-width: 0.6; } /* 4. Medium Grey */
      .bar-std { fill: #27272A; stroke: #FFFFFF; stroke-width: 0.6; } /* 5. Dark Charcoal Grey */
    </style>
  </defs>

  <!-- Full Pure Black Background -->
  <rect width="760" height="560" class="bg"/>

  <!-- Logo Pill Accent from image -->
  <g transform="translate(40, 24)">
    <circle cx="12" cy="12" r="11" fill="#E8F8B6" opacity="0.5"/>
    <circle cx="12" cy="12" r="7" fill="#D2F831" filter="url(#neonGlow)"/>
  </g>

  <!-- Title -->
  <text x="440" y="36" class="title">Sorting 10⁶ elements</text>

  <!-- Chart Bounding Box (x: 180 to 720, y: 55 to 485) -->
  <rect x="180" y="55" width="540" height="430" class="chart-box"/>

  <!-- Vertical Ticks & Grid Lines (0, 50, 100, 150, 200, 250, 300, 350) -->
  <!-- scale = 540 / 350 = 1.5428 px per cycle -->
  <line x1="180" y1="55" x2="180" y2="492" class="tick"/>
  <text x="180" y="508" class="x-label">0</text>

  <line x1="257" y1="55" x2="257" y2="485" class="grid"/>
  <line x1="257" y1="485" x2="257" y2="492" class="tick"/>
  <text x="257" y="508" class="x-label">50</text>

  <line x1="334" y1="55" x2="334" y2="485" class="grid"/>
  <line x1="334" y1="485" x2="334" y2="492" class="tick"/>
  <text x="334" y="508" class="x-label">100</text>

  <line x1="411" y1="55" x2="411" y2="485" class="grid"/>
  <line x1="411" y1="485" x2="411" y2="492" class="tick"/>
  <text x="411" y="508" class="x-label">150</text>

  <line x1="488" y1="55" x2="488" y2="485" class="grid"/>
  <line x1="488" y1="485" x2="488" y2="492" class="tick"/>
  <text x="488" y="508" class="x-label">200</text>

  <line x1="565" y1="55" x2="565" y2="485" class="grid"/>
  <line x1="565" y1="485" x2="565" y2="492" class="tick"/>
  <text x="565" y="508" class="x-label">250</text>

  <line x1="642" y1="55" x2="642" y2="485" class="grid"/>
  <line x1="642" y1="485" x2="642" y2="492" class="tick"/>
  <text x="642" y="508" class="x-label">300</text>

  <line x1="720" y1="55" x2="720" y2="492" class="tick"/>
  <text x="720" y="508" class="x-label">350</text>

  <!-- X-Axis Label -->
  <text x="450" y="534" class="axis-title">Cycles per element (Apple Silicon M1 @ 3.2GHz)</text>

  <!-- ==================== ROWS (Height per row = 53.75px) ==================== -->

  <!-- ROW 1: Shuffled (y: 62) -->
  <text x="170" y="88" class="y-label">Shuffled</text>
  <rect x="180" y="62" width="48" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="70" width="53" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="78" width="174" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="86" width="102" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="94" width="335" height="7" rx="1" class="bar-std"/>

  <!-- ROW 2: Shuffled (16 values) (y: 116) -->
  <text x="170" y="142" class="y-label">Shuffled (16 values)</text>
  <rect x="180" y="116" width="18" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="124" width="18" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="132" width="34" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="140" width="73" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="148" width="192" height="7" rx="1" class="bar-std"/>

  <!-- ROW 3: All equal (y: 170) -->
  <text x="170" y="196" class="y-label">All equal</text>
  <rect x="180" y="170" width="6" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="178" width="6" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="186" width="9" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="194" width="71" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="202" width="58" height="7" rx="1" class="bar-std"/>

  <!-- ROW 4: Ascending (y: 224) -->
  <text x="170" y="250" class="y-label">Ascending</text>
  <rect x="180" y="224" width="6" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="232" width="6" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="240" width="8" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="248" width="113" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="256" width="76" height="7" rx="1" class="bar-std"/>

  <!-- ROW 5: Descending (y: 278) -->
  <text x="170" y="304" class="y-label">Descending</text>
  <rect x="180" y="278" width="9" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="286" width="9" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="294" width="13" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="302" width="120" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="310" width="84" height="7" rx="1" class="bar-std"/>

  <!-- ROW 6: Pipe organ (y: 332) -->
  <text x="170" y="358" class="y-label">Pipe organ</text>
  <rect x="180" y="332" width="72" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="340" width="71" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="348" width="183" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="356" width="134" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="364" width="395" height="7" rx="1" class="bar-std"/>

  <!-- ROW 7: Push front (y: 386) -->
  <text x="170" y="412" class="y-label">Push front</text>
  <rect x="180" y="386" width="48" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="394" width="53" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="402" width="71" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="410" width="139" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="418" width="484" height="7" rx="1" class="bar-std"/>

  <!-- ROW 8: Push middle (y: 440) -->
  <text x="170" y="466" class="y-label">Push middle</text>
  <rect x="180" y="440" width="48" height="7" rx="1" class="bar-apex"/>
  <rect x="180" y="448" width="53" height="7" rx="1" class="bar-qisort"/>
  <rect x="180" y="456" width="10" height="7" rx="1" class="bar-pdq"/>
  <rect x="180" y="464" width="83" height="7" rx="1" class="bar-ska"/>
  <rect x="180" y="472" width="274" height="7" rx="1" class="bar-std"/>

  <!-- ==================== LEGEND BOX ==================== -->
  <g transform="translate(555, 185)">
    <rect width="155" height="120" rx="4" class="legend-box"/>
    
    <rect x="10" y="10" width="20" height="9" rx="1" class="bar-apex"/>
    <text x="38" y="18" class="legend-text">qi::apex</text>

    <rect x="10" y="32" width="20" height="9" rx="1" class="bar-qisort"/>
    <text x="38" y="40" class="legend-text">qi::sort</text>

    <rect x="10" y="54" width="20" height="9" rx="1" class="bar-pdq"/>
    <text x="38" y="62" class="legend-text">pdqsort</text>

    <rect x="10" y="76" width="20" height="9" rx="1" class="bar-ska"/>
    <text x="38" y="84" class="legend-text">ska_sort</text>

    <rect x="10" y="98" width="20" height="9" rx="1" class="bar-std"/>
    <text x="38" y="106" class="legend-text">std::sort</text>
  </g>

</svg>
