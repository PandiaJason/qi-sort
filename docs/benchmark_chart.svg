<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" height="100%">
  <defs>
    <!-- 3 Custom Color Tokens -->
    <linearGradient id="apexBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5F53D"/>
      <stop offset="100%" stop-color="#E2FB5E"/>
    </linearGradient>
    <linearGradient id="pdqBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4FBD2"/>
      <stop offset="100%" stop-color="#E8F8B6"/>
    </linearGradient>
    <linearGradient id="stdBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#444C56"/>
    </linearGradient>

    <style>
      .bg { fill: #0E1217; }
      .chart-box { fill: #141922; stroke: #FAF9F6; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #FAF9F6; text-anchor: middle; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #FAF9F6; font-weight: 600; text-anchor: middle; }
      .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #FAF9F6; font-weight: 500; text-anchor: end; }
      .x-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #FAF9F6; text-anchor: middle; }
      .tick { stroke: #FAF9F6; stroke-width: 1.2; }
      .grid { stroke: #21262D; stroke-dasharray: 2,2; stroke-width: 1; }
      .legend-box { fill: #0E1217; stroke: #FAF9F6; stroke-width: 1.2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FAF9F6; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" class="bg"/>

  <!-- Title -->
  <text x="440" y="32" class="title">Sorting 10⁶ elements</text>

  <!-- Chart Bounding Box (x: 180 to 680, y: 45 to 420) -->
  <rect x="180" y="45" width="500" height="375" class="chart-box"/>

  <!-- Vertical Ticks & Grid Lines (0, 50, 100, 150, 200, 250, 300, 350) -->
  <!-- 0 at x=180, 350 at x=680 => width=500 => scale = 500/350 = 1.4285 px per cycle -->
  <line x1="180" y1="45" x2="180" y2="425" class="tick"/>
  <text x="180" y="442" class="x-label">0</text>

  <line x1="251" y1="45" x2="251" y2="420" class="grid"/>
  <line x1="251" y1="420" x2="251" y2="425" class="tick"/>
  <text x="251" y="442" class="x-label">50</text>

  <line x1="323" y1="45" x2="323" y2="420" class="grid"/>
  <line x1="323" y1="420" x2="323" y2="425" class="tick"/>
  <text x="323" y="442" class="x-label">100</text>

  <line x1="394" y1="45" x2="394" y2="420" class="grid"/>
  <line x1="394" y1="420" x2="394" y2="425" class="tick"/>
  <text x="394" y="442" class="x-label">150</text>

  <line x1="466" y1="45" x2="466" y2="420" class="grid"/>
  <line x1="466" y1="420" x2="466" y2="425" class="tick"/>
  <text x="466" y="442" class="x-label">200</text>

  <line x1="537" y1="45" x2="537" y2="420" class="grid"/>
  <line x1="537" y1="420" x2="537" y2="425" class="tick"/>
  <text x="537" y="442" class="x-label">250</text>

  <line x1="609" y1="45" x2="609" y2="420" class="grid"/>
  <line x1="609" y1="420" x2="609" y2="425" class="tick"/>
  <text x="609" y="442" class="x-label">300</text>

  <line x1="680" y1="45" x2="680" y2="425" class="tick"/>
  <text x="680" y="442" class="x-label">350</text>

  <!-- X-Axis Label -->
  <text x="430" y="468" class="axis-title">Cycles per element (Apple Silicon M1 @ 3.2GHz)</text>

  <!-- ==================== ROWS ==================== -->

  <!-- ROW 1: Shuffled (y: 56) -->
  <text x="170" y="74" class="y-label">Shuffled</text>
  <rect x="180" y="56" width="48" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="66" width="164" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="76" width="314" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 2: Shuffled (16 values) (y: 102) -->
  <text x="170" y="120" class="y-label">Shuffled (16 values)</text>
  <rect x="180" y="102" width="18" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="112" width="30" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="122" width="179" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 3: All equal (y: 148) -->
  <text x="170" y="166" class="y-label">All equal</text>
  <rect x="180" y="148" width="6" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="158" width="8" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="168" width="54" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 4: Ascending (y: 194) -->
  <text x="170" y="212" class="y-label">Ascending</text>
  <rect x="180" y="194" width="6" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="204" width="7" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="214" width="71" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 5: Descending (y: 240) -->
  <text x="170" y="258" class="y-label">Descending</text>
  <rect x="180" y="240" width="8" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="250" width="11" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="260" width="79" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 6: Pipe organ (y: 286) -->
  <text x="170" y="304" class="y-label">Pipe organ</text>
  <rect x="180" y="286" width="67" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="296" width="171" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="306" width="371" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 7: Push front (y: 332) -->
  <text x="170" y="350" class="y-label">Push front</text>
  <rect x="180" y="332" width="48" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="342" width="66" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="352" width="454" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ROW 8: Push middle (y: 378) -->
  <text x="170" y="396" class="y-label">Push middle</text>
  <rect x="180" y="378" width="48" height="10" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="388" width="8" height="10" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
  <rect x="180" y="398" width="256" height="10" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>

  <!-- ==================== LEGEND BOX ==================== -->
  <g transform="translate(520, 195)">
    <rect width="150" height="75" class="legend-box"/>
    
    <rect x="10" y="10" width="24" height="12" fill="url(#apexBar)" stroke="#FAF9F6" stroke-width="0.8"/>
    <text x="42" y="21" class="legend-text">qi::apex</text>

    <rect x="10" y="31" width="24" height="12" fill="url(#pdqBar)" stroke="#FAF9F6" stroke-width="0.8"/>
    <text x="42" y="42" class="legend-text">pdqsort</text>

    <rect x="10" y="52" width="24" height="12" fill="url(#stdBar)" stroke="#FAF9F6" stroke-width="0.8"/>
    <text x="42" y="63" class="legend-text">std::sort</text>
  </g>

</svg>
