<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #58a6ff; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .code-font { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; fill: #7ee787; }
      .flow-line { stroke: #388bfd; stroke-width: 2.5; fill: none; stroke-dasharray: 6,4; animation: dash 1.5s linear infinite; }
      @keyframes dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      .pulse-node { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1.0; filter: drop-shadow(0 0 8px rgba(56, 139, 253, 0.6)); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="12" fill="url(#bgGrad2)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="42" class="title">qi::apex Architecture &amp; Execution Pipeline</text>
  <text x="35" y="64" class="subtitle">Hardware-Aware Adaptive Radix &amp; Linear Counting Engine · 20 KB L1-D Bounded</text>

  <!-- STEP 1: Input Stream -->
  <g transform="translate(40, 95)">
    <rect width="180" height="340" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="32" class="box-title">1. Input Array</text>
    <text x="20" y="55" class="box-desc">Raw Unordered Feed</text>
    <text x="20" y="75" class="box-desc">N = 10,000,000 Keys</text>
    
    <g transform="translate(20, 100)">
      <rect width="140" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
      <text x="12" y="16" class="code-font">[0x9F3B2104]</text>
      
      <rect y="32" width="140" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
      <text x="12" y="48" class="code-font">[0x00000042]</text>

      <rect y="64" width="140" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
      <text x="12" y="80" class="code-font">[0x12A0C94F]</text>

      <rect y="96" width="140" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
      <text x="12" y="112" class="code-font">[0xFFFFFFFF]</text>

      <rect y="128" width="140" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
      <text x="12" y="144" class="code-font">[0x000000FF]</text>
    </g>

    <text x="20" y="300" class="subtitle">Universal Types:</text>
    <text x="20" y="320" class="code-font">u32, i32, f32, u64, pairs</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 220 265 L 260 265" class="flow-line"/>

  <!-- STEP 2: 50ns Inline Bitwise Probe -->
  <g transform="translate(260, 95)" class="pulse-node">
    <rect width="200" height="340" rx="8" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.8"/>
    <text x="20" y="32" class="box-title">2. 50ns Inline Probe</text>
    <text x="20" y="55" class="box-desc">Pure-Integer Sampling</text>
    
    <g transform="translate(18, 85)">
      <rect width="164" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="10" y="22" class="code-font">bitOr |= data[i]</text>
      <text x="10" y="42" class="code-font">seen[v &amp; 0xFF] = 1</text>
    </g>

    <g transform="translate(18, 160)">
      <text x="0" y="18" class="box-desc">Metrics Computed:</text>
      <text x="0" y="38" class="code-font">• Active Bit Width</text>
      <text x="0" y="56" class="code-font">• Duplicate Density</text>
      <text x="0" y="74" class="code-font">• Monotonic Order</text>
      <text x="0" y="92" class="code-font">• Range Extents</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="164" height="40" rx="4" fill="#238636" fill-opacity="0.2" stroke="#238636"/>
      <text x="12" y="24" class="code-font" fill="#3fb950">Overhead &lt; 0.2%</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 460 265 L 500 265" class="flow-line"/>

  <!-- STEP 3: L1-D Radix Engine & Histograms -->
  <g transform="translate(500, 95)">
    <rect width="210" height="340" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="32" class="box-title">3. Strict 20KB L1-D</text>
    <text x="20" y="55" class="box-desc">Hardware-Bound Memory</text>

    <!-- Histograms Stack -->
    <g transform="translate(20, 85)">
      <rect width="170" height="40" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
      <text x="12" y="20" class="code-font" fill="#58a6ff">Pass 0 (11b): 8 KB</text>
      <text x="12" y="34" class="subtitle">2,048 bins · L1 Resident</text>

      <rect y="50" width="170" height="40" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
      <text x="12" y="70" class="code-font" fill="#58a6ff">Pass 1 (11b): 8 KB</text>
      <text x="12" y="84" class="subtitle">2,048 bins · L1 Resident</text>

      <rect y="100" width="170" height="40" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
      <text x="12" y="120" class="code-font" fill="#58a6ff">Pass 2 (10b): 4 KB</text>
      <text x="12" y="134" class="subtitle">1,024 bins · L1 Resident</text>
    </g>

    <g transform="translate(20, 245)">
      <text x="0" y="18" class="box-desc">Total L1 Footprint:</text>
      <text x="0" y="38" class="code-font" fill="#7ee787">★ Exactly 20 KB</text>
      <text x="0" y="56" class="subtitle">100% Fits 32KB/48KB L1</text>
      <text x="0" y="74" class="subtitle">0 DRAM Cache Stalls</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 710 265 L 750 265" class="flow-line"/>

  <!-- STEP 4: Execution Units & Output -->
  <g transform="translate(750, 95)">
    <rect width="160" height="340" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="32" class="box-title">4. Output Feed</text>
    <text x="16" y="55" class="box-desc">Sorted Array Stream</text>

    <g transform="translate(16, 90)">
      <rect width="128" height="40" rx="4" fill="#238636" fill-opacity="0.3" stroke="#238636"/>
      <text x="10" y="24" class="code-font" fill="#3fb950">8-Way ILP</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="128" height="40" rx="4" fill="#238636" fill-opacity="0.3" stroke="#238636"/>
      <text x="10" y="24" class="code-font" fill="#3fb950">PF=48 Prefetch</text>
    </g>

    <g transform="translate(16, 210)">
      <text x="0" y="18" class="box-desc">Peak Performance:</text>
      <text x="0" y="42" class="title" fill="#3fb950" font-size="22">36.5 ms</text>
      <text x="0" y="62" class="code-font">10,000,000 Keys</text>
      <text x="0" y="82" class="subtitle">568 MKeys/s (Par)</text>
    </g>
  </g>

</svg>
