<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#141922"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="visCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#12161F"/>
    </linearGradient>

    <!-- Color 1: Primary Electric Lime (#D5F53D) -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5F53D"/>
      <stop offset="100%" stop-color="#E2FB5E"/>
    </linearGradient>

    <!-- Color 2: Soft Pale Lime Aura (#F4FBD2) -->
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4FBD2"/>
      <stop offset="100%" stop-color="#E8F8B6"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#D5F53D" flood-opacity="0.4"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FAF9F6; letter-spacing: -0.3px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8B949E; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #D5F53D; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FAF9F6; }
      .code-font { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; fill: #D5F53D; }
      .flow-line { stroke: #D5F53D; stroke-width: 2; fill: none; stroke-dasharray: 6,4; animation: dash 1.5s linear infinite; }
      @keyframes dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      .pulse-card { animation: pulse 2.5s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { stroke: #30363D; }
        50% { stroke: #D5F53D; filter: drop-shadow(0 0 6px rgba(213, 245, 61, 0.4)); }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="950" height="480" rx="16" fill="url(#visBg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- Color Accent Tag -->
  <g transform="translate(35, 30)">
    <circle cx="10" cy="10" r="10" fill="#F4FBD2" opacity="0.4"/>
    <circle cx="10" cy="10" r="6" fill="#D5F53D"/>
  </g>

  <!-- Header -->
  <text x="65" y="42" class="title">qi::apex Architecture &amp; Execution Pipeline</text>
  <text x="65" y="63" class="subtitle">Hardware-Aware Adaptive Radix &amp; Linear Counting Engine · 20 KB L1-D Bounded</text>

  <!-- STEP 1: Input Array Stream -->
  <g transform="translate(40, 95)">
    <rect width="180" height="340" rx="10" fill="url(#visCard)" stroke="#30363D" stroke-width="1.2"/>
    <text x="20" y="32" class="box-title">1. Input Array</text>
    <text x="20" y="55" class="box-desc">Raw Unordered Feed</text>
    <text x="20" y="75" class="subtitle">N = 10,000,000 Keys</text>
    
    <g transform="translate(20, 100)">
      <rect width="140" height="24" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="16" class="code-font" fill="#FAF9F6">[0x9F3B2104]</text>
      
      <rect y="32" width="140" height="24" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="48" class="code-font" fill="#FAF9F6">[0x00000042]</text>

      <rect y="64" width="140" height="24" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="80" class="code-font" fill="#FAF9F6">[0x12A0C94F]</text>

      <rect y="96" width="140" height="24" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="112" class="code-font" fill="#FAF9F6">[0xFFFFFFFF]</text>

      <rect y="128" width="140" height="24" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="144" class="code-font" fill="#FAF9F6">[0x000000FF]</text>
    </g>

    <text x="20" y="300" class="subtitle">Supported Types:</text>
    <text x="20" y="320" class="code-font">u32, i32, f32, u64, pairs</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 220 265 L 260 265" class="flow-line"/>

  <!-- STEP 2: 50ns Inline Bitwise Probe -->
  <g transform="translate(260, 95)" class="pulse-card">
    <rect width="200" height="340" rx="10" fill="url(#visCard)" stroke="#30363D" stroke-width="1.5"/>
    <text x="20" y="32" class="box-title">2. 50ns Inline Probe</text>
    <text x="20" y="55" class="box-desc">Pure-Integer Sampling</text>
    
    <g transform="translate(18, 85)">
      <rect width="164" height="60" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="12" y="24" class="code-font">bitOr |= data[i]</text>
      <text x="12" y="44" class="code-font">seen[v &amp; 0xFF] = 1</text>
    </g>

    <g transform="translate(18, 165)">
      <text x="0" y="18" class="box-desc">Metrics Computed:</text>
      <text x="0" y="38" class="code-font" fill="#FAF9F6">• Active Bit Width</text>
      <text x="0" y="56" class="code-font" fill="#FAF9F6">• Duplicate Density</text>
      <text x="0" y="74" class="code-font" fill="#FAF9F6">• Monotonic Order</text>
      <text x="0" y="92" class="code-font" fill="#FAF9F6">• Range Extents</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="164" height="40" rx="6" fill="#D5F53D" fill-opacity="0.15" stroke="#D5F53D"/>
      <text x="16" y="25" class="code-font" font-weight="700">Overhead &lt; 0.2%</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 460 265 L 500 265" class="flow-line"/>

  <!-- STEP 3: L1-D Radix Engine & Histograms -->
  <g transform="translate(500, 95)">
    <rect width="210" height="340" rx="10" fill="url(#visCard)" stroke="#30363D" stroke-width="1.2"/>
    <text x="20" y="32" class="box-title">3. Strict 20KB L1-D</text>
    <text x="20" y="55" class="box-desc">Hardware-Bound Memory</text>

    <!-- Histograms Stack -->
    <g transform="translate(20, 85)">
      <rect width="170" height="40" rx="6" fill="#D5F53D" fill-opacity="0.1" stroke="#D5F53D"/>
      <text x="12" y="20" class="code-font">Pass 0 (11b): 8 KB</text>
      <text x="12" y="34" class="subtitle">2,048 bins · L1 Resident</text>

      <rect y="50" width="170" height="40" rx="6" fill="#D5F53D" fill-opacity="0.1" stroke="#D5F53D"/>
      <text x="12" y="70" class="code-font">Pass 1 (11b): 8 KB</text>
      <text x="12" y="84" class="subtitle">2,048 bins · L1 Resident</text>

      <rect y="100" width="170" height="40" rx="6" fill="#D5F53D" fill-opacity="0.1" stroke="#D5F53D"/>
      <text x="12" y="120" class="code-font">Pass 2 (10b): 4 KB</text>
      <text x="12" y="134" class="subtitle">1,024 bins · L1 Resident</text>
    </g>

    <g transform="translate(20, 245)">
      <text x="0" y="18" class="box-desc">Total L1 Footprint:</text>
      <text x="0" y="38" class="code-font" font-size="13" font-weight="700">Exactly 20 KB</text>
      <text x="0" y="56" class="subtitle">100% Fits 32KB/48KB L1</text>
      <text x="0" y="74" class="subtitle">0 DRAM Cache Stalls</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 710 265 L 750 265" class="flow-line"/>

  <!-- STEP 4: Execution Units & Output -->
  <g transform="translate(750, 95)">
    <rect width="160" height="340" rx="10" fill="url(#visCard)" stroke="#30363D" stroke-width="1.2"/>
    <text x="16" y="32" class="box-title">4. Output Feed</text>
    <text x="16" y="55" class="box-desc">Sorted Stream</text>

    <g transform="translate(16, 90)">
      <rect width="128" height="38" rx="6" fill="#D5F53D" fill-opacity="0.15" stroke="#D5F53D"/>
      <text x="12" y="24" class="code-font" font-weight="700">8-Way ILP</text>
    </g>

    <g transform="translate(16, 138)">
      <rect width="128" height="38" rx="6" fill="#D5F53D" fill-opacity="0.15" stroke="#D5F53D"/>
      <text x="12" y="24" class="code-font" font-weight="700">PF=48 Prefetch</text>
    </g>

    <g transform="translate(16, 210)">
      <text x="0" y="18" class="box-desc">Peak Performance:</text>
      <text x="0" y="42" class="title" fill="#D5F53D" font-size="22">36.5 ms</text>
      <text x="0" y="62" class="code-font" fill="#FAF9F6">10,000,000 Keys</text>
      <text x="0" y="82" class="subtitle">568 MKeys/s (Par)</text>
    </g>
  </g>

</svg>
